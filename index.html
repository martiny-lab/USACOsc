<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="USACO Bronze 문제를 회차별로 탐색하는 Martiny Lab 공개 문제 큐레이션">
    <title>Martin's USACO Space Center</title>
    <link id="theme-favicon" rel="icon" type="image/png" sizes="32x32" href="assets/martiny-symbol-clean-64.png">
    <link rel="stylesheet" href="style.css?v=20260709-public-19">
    <script src="app.js?v=20260709-public-21" defer></script>
  </head>
  <body>
    <noscript>
      <main class="load-fail">JavaScript가 꺼져 있어 문제 목록을 불러올 수 없습니다.</main>
    </noscript>

    <header class="topbar">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true">
          <img src="assets/martiny-symbol-clean.png" alt="">
        </span>
        <span>
          <strong>Martin's USACO Space Center</strong>
        </span>
      </a>
    </header>

    <main class="desk-shell public-shell" id="desk-shell">
      <aside class="exam-rail" id="exam-rail" aria-label="문제 묶음 선택">
        <label class="search-box" for="search-input">
          <span>검색</span>
          <input id="search-input" type="search" placeholder="문제 제목 또는 번호">
        </label>

        <div class="filter-groups">
          <details class="filter-group">
            <summary>난이도</summary>
            <button class="filter-clear" id="difficulty-clear" type="button">초기화</button>
            <div class="filter-group-body">
              <div class="filter-chips" id="difficulty-filters"></div>
            </div>
          </details>

          <details class="filter-group">
            <summary>알고리즘</summary>
            <button class="filter-clear" id="algorithm-clear" type="button">초기화</button>
            <div class="filter-group-body">
              <div class="filter-chips algorithm-chips" id="algorithm-filters"></div>
            </div>
          </details>
        </div>

        <div class="exam-list" id="exam-list"></div>
      </aside>

      <button class="splitter" id="splitter-rail" type="button" aria-label="왼쪽 패널 너비 조절"></button>

      <section class="exam-paper" aria-label="선택 문제 묶음">
        <header class="paper-header">
          <div>
            <span id="exam-eyebrow">Problems</span>
            <h2 id="exam-title">문제를 선택하세요</h2>
          </div>
        </header>
        <nav class="month-tabs" id="month-tabs" aria-label="월 선택"></nav>
        <div class="problem-stack" id="problem-stack"></div>
      </section>

    </main>

    <section class="load-fail" id="load-error" hidden>
      <strong>데이터를 불러오지 못했습니다.</strong>
      <span>로컬 서버에서 열고 있는지, `problems.json`과 `problem-classifications.json`이 있는지 확인해 주세요.</span>
    </section>
  </body>
</html>
